[workspace]
resolver = "3"
members = [
    ".",
    "crates/contract",
    "crates/core",
]
exclude = ["_refs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
resonance-contract = { path = "crates/contract" }
resonance-core = { path = "crates/core" }

# NSH Pure Rust UI framework — strictly pinned to =0.7.0 (rapid upstream churn protection)
nsh-core = "=0.7.0"
nsh-base = { version = "=0.7.0", default-features = false }
nsh-engine = { version = "=0.7.0", default-features = false }
nsh-testing = { version = "=0.7.0", default-features = false }

# Core runtime, networking (rustls), serialization, database, crypto, QuickJS-NG
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
rusqlite = { version = "0.33", features = ["bundled"] }
rquickjs = { version = "0.12.0", features = ["classes"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
lru = "0.13"
url = "2.5"
bytes = "1.9"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
crossbeam-channel = "0.5"
tempfile = "3.16"
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
lofty = "0.22"

[package]
name = "resonance"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonance"
crate-type = ["rlib", "cdylib"]

[features]
default = []
desktop-keyring = ["dep:keyring"]
desktop-mpris = ["dep:souvlaki"]
desktop-native = ["desktop-mpris", "desktop-keyring"]

[dependencies]
resonance-contract.workspace = true
resonance-core.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
async-trait.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
souvlaki = { version = "0.8", optional = true }
nsh-engine.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
lofty.workspace = true
rusqlite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
