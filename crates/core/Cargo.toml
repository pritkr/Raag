[package]
name = "resonance-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["provider-ytmapi", "provider-rustypipe", "lan-casting"]
provider-ytmapi = ["dep:ytmapi-rs"]
provider-rustypipe = ["dep:rustypipe"]
lan-casting = []

[dependencies]
resonance-contract.workspace = true
tokio.workspace = true
reqwest.workspace = true
ytmapi-rs = { workspace = true, optional = true }
rustypipe = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
rquickjs.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
lru.workspace = true
url.workspace = true
bytes.workspace = true
log.workspace = true
rand.workspace = true
crossbeam-channel.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
lofty.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
tokio-tungstenite.workspace = true
mdns-sd.workspace = true
prost.workspace = true
tokio-rustls.workspace = true
rupnp.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[dev-dependencies]
tempfile.workspace = true
