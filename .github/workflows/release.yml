name: Release

on:
  push:
    branches: [production]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Raag
  APP_ID: dev.resonance.ytmusic
  NSH_VERSION: "0.7.0"

jobs:
  verify:
    name: Fast Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets

      - name: Run truth & architecture gate tests
        run: cargo test --test h0_account_truth_test --test architecture_gates_v2

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK & SDK components
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install NSH CLI (0.7.0)
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --version "$NSH_VERSION" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.NSH_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist-android
          if command -v nsh >/dev/null 2>&1; then
            if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$NSH_KEYSTORE_PASSWORD" ]; then
              echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
              nsh package --target android --abi arm64-v8a --keystore release.keystore --key-alias "$ANDROID_KEY_ALIAS"
              python3 scripts/shrink-android-apk.py .nsh/out/*.apk --keystore release.keystore --key-alias "$ANDROID_KEY_ALIAS" --keystore-password "$NSH_KEYSTORE_PASSWORD"
              rm -f release.keystore
            else
              echo "Keystore secrets not configured; falling back to debug-signed APK"
              nsh package --target android --abi arm64-v8a
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
              python3 scripts/shrink-android-apk.py .nsh/out/*.apk
            fi
            cp .nsh/out/*.apk dist-android/
          else
            echo "nsh CLI unavailable; falling back to cargo build --release + Gradle"
            cargo build --release --target aarch64-linux-android
            chmod +x platform/android/gradlew 2>/dev/null || true
            if [ -x platform/android/gradlew ]; then
              platform/android/gradlew -p platform/android assembleRelease
            else
              gradle -p platform/android assembleRelease
            fi
            find platform/android -name "*.apk" -exec cp {} dist-android/ \;
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*.apk

  macos:
    name: macOS (.dmg + .zip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSH CLI (0.7.0)
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --version "$NSH_VERSION" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package macOS app
        run: |
          mkdir -p dist-macos
          if command -v nsh >/dev/null 2>&1; then
            nsh package --target macos
            APP_BUNDLE=$(ls -d .nsh/out/*.app | head -n1)
            ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "dist-macos/${{ env.APP_NAME }}-macos.zip"
            hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP_BUNDLE" -ov -format UDZO "dist-macos/${{ env.APP_NAME }}-macos.dmg"
          else
            cargo build --release --bin resonance --features desktop-native
            mkdir -p "dist-macos/${{ env.APP_NAME }}"
            cp target/release/resonance "dist-macos/${{ env.APP_NAME }}/"
            ditto -c -k --sequesterRsrc --keepParent "dist-macos/${{ env.APP_NAME }}" "dist-macos/${{ env.APP_NAME }}-macos.zip"
            hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "dist-macos/${{ env.APP_NAME }}" -ov -format UDZO "dist-macos/${{ env.APP_NAME }}-macos.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            dist-macos/*.dmg
            dist-macos/*.zip

  ios:
    name: iOS (.app zip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install NSH CLI (0.7.0)
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --version "$NSH_VERSION" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package iOS app
        run: |
          mkdir -p dist-ios
          if command -v nsh >/dev/null 2>&1; then
            nsh package --target ios
            APP_BUNDLE=$(ls -d .nsh/out/*.app 2>/dev/null | head -n1 || true)
            if [ -n "$APP_BUNDLE" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "dist-ios/raag-ios.zip"
            elif ls .nsh/out/*.ipa >/dev/null 2>&1; then
              cp .nsh/out/*.ipa "dist-ios/raag-ios.ipa"
              ditto -c -k --sequesterRsrc "dist-ios/raag-ios.ipa" "dist-ios/raag-ios.zip"
              rm -f "dist-ios/raag-ios.ipa"
            else
              echo "No .app or .ipa produced in .nsh/out" >&2
              ls -la .nsh/out || true
              exit 1
            fi
          else
            cargo build --release --target aarch64-apple-ios
            mkdir -p "dist-ios/${{ env.APP_NAME }}.app"
            cp target/aarch64-apple-ios/release/libresonance.a "dist-ios/${{ env.APP_NAME }}.app/" 2>/dev/null || true
            ditto -c -k --sequesterRsrc --keepParent "dist-ios/${{ env.APP_NAME }}.app" "dist-ios/raag-ios.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: dist-ios/raag-ios.zip

  windows:
    name: Windows (.exe installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSH CLI (0.7.0)
        shell: pwsh
        run: |
          try { irm https://nsh.dev/install.ps1 | iex } catch { Write-Warning "nsh install failed; will fallback to cargo" }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          if (Get-Command nsh -ErrorAction SilentlyContinue) {
            nsh package --target windows
            $outDir = Resolve-Path ".nsh\out\${{ env.APP_NAME }}"
          } else {
            cargo build --release --bin resonance --features desktop-native
            $fallbackDir = "dist-windows\staging"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            Copy-Item "target\release\resonance.exe" "$fallbackDir\${{ env.APP_NAME }}.exe"
            $outDir = Resolve-Path $fallbackDir
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          }
          $iss = @"
          [Setup]
          AppName=${{ env.APP_NAME }}
          AppVersion=0.1.0
          DefaultDirName={autopf}\${{ env.APP_NAME }}
          DefaultGroupName=${{ env.APP_NAME }}
          OutputDir=dist-windows
          OutputBaseFilename=${{ env.APP_NAME }}-windows-setup
          Compression=lzma2
          SolidCompression=yes

          [Files]
          Source: "$outDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\${{ env.APP_NAME }}"; Filename: "{app}\${{ env.APP_NAME }}.exe"
          Name: "{autodesktop}\${{ env.APP_NAME }}"; Filename: "{app}\${{ env.APP_NAME }}.exe"
          "@
          $iss | Out-File -FilePath raag.iss -Encoding utf8
          iscc raag.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-windows/*.exe

  linux:
    name: Linux (.deb + .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4.14+, OpenSSL, D-Bus & packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev libgtk-4-dev libdbus-1-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSH CLI (0.7.0)
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --version "$NSH_VERSION" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package Linux (.tar.gz + .deb)
        run: |
          mkdir -p dist-linux
          PKG_ROOT="pkg-deb"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PKG_ROOT/opt/${{ env.APP_NAME }}" "$PKG_ROOT/usr/share/applications" "$PKG_ROOT/usr/share/icons/hicolor/512x512/apps"

          if command -v nsh >/dev/null 2>&1; then
            nsh package --target linux
            cp .nsh/out/*.tar.gz dist-linux/
            cp -r .nsh/out/${{ env.APP_NAME }}/* "$PKG_ROOT/opt/${{ env.APP_NAME }}/"
          else
            cargo build --release --bin resonance --features desktop-native
            mkdir -p "staging/${{ env.APP_NAME }}"
            cp target/release/resonance "staging/${{ env.APP_NAME }}/${{ env.APP_NAME }}"
            tar -czf "dist-linux/${{ env.APP_NAME }}-linux-amd64.tar.gz" -C staging "${{ env.APP_NAME }}"
            cp -r "staging/${{ env.APP_NAME }}"/* "$PKG_ROOT/opt/${{ env.APP_NAME }}/"
          fi

          cp assets/icon.png "$PKG_ROOT/usr/share/icons/hicolor/512x512/apps/raag.png"
          cat > "$PKG_ROOT/usr/share/applications/raag.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Raag
          Comment=Pure Rust YouTube Music Client
          Exec=/opt/Raag/Raag
          Icon=raag
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Music;Player;
          DESKTOP
          cat > "$PKG_ROOT/DEBIAN/control" <<'CONTROL'
          Package: raag
          Version: 0.1.0
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libasound2t64
          Maintainer: Raag Contributors
          Description: Pure Rust YouTube Music client built on Native Shell (NSH)
          CONTROL
          dpkg-deb --build "$PKG_ROOT" "dist-linux/${{ env.APP_NAME }}-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            dist-linux/*.deb
            dist-linux/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [verify, android, macos, ios, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install NSH CLI (0.7.0)
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --version "$NSH_VERSION" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate signed NSH updater manifest
        env:
          NSH_UPDATER_PRIVATE_KEY: ${{ secrets.NSH_UPDATER_PRIVATE_KEY }}
        run: |
          mkdir -p artifacts/manifest
          if [ -n "$NSH_UPDATER_PRIVATE_KEY" ] && command -v nsh >/dev/null 2>&1; then
            umask 077
            KEY_FILE="$RUNNER_TEMP/update.secret"
            printf '%s' "$NSH_UPDATER_PRIVATE_KEY" > "$KEY_FILE"
            nsh update-manifest \
              artifacts/macos-bundle/*.zip \
              artifacts/windows-installer/*.exe \
              artifacts/linux-bundle/*.tar.gz \
              artifacts/android-apk/*.apk \
              --notes CHANGELOG.md \
              --key "$KEY_FILE" \
              -o artifacts/manifest/ || true
          else
            echo "NSH_UPDATER_PRIVATE_KEY or nsh CLI unavailable; skipping manifest signing"
          fi

      - name: Cleanup ephemeral updater key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/update.secret"

      - name: Determine release tag (beta-latest vs tag)
        id: reltag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "beta_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "beta_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag_name }}
          files: artifacts/**/*
          prerelease: ${{ steps.reltag.outputs.prerelease == 'true' }}
          generate_release_notes: true

      - name: Publish beta-latest channel manifest
        if: steps.reltag.outputs.beta_sync == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          prerelease: true
          files: artifacts/manifest/*
